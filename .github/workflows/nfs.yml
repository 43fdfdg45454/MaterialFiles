name: NFS

on:
  push:
    branches: [nfs]
  workflow_dispatch:

env:
  # The libnfs-android commit of the AAR version app/build.gradle uses (0.5.4): the host jobs
  # build its JNI library for the machine itself. Update both together.
  LIBNFS_REF: d01daa3127963502116acf12d2ac91caced6eb2a

jobs:
  build:
    name: Build test APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check that every test is in exactly one emulator shard
        run: |
          python3 - <<'PY'
          import re
          base = 'app/src/%s/java/me/zhanghai/android/files/provider/nfs/'
          groups = ('idle', 'stream', 'transfer', 'movies', 'scenes', 'load', 'jumps', 'changes')
          def assigned(path):
              source = open(path).read()
              shards = source[source.index('val SHARDS'):]
              shards = shards[:shards.index('\n        )\n')]
              return [n for n in re.findall(r'"(\w+)"', shards.split('mapOf(', 1)[1]) if n not in groups]
          tests = lambda path: re.findall(r'@Test\s+fun (\w+)', open(path).read())
          scenarios = tests(base % 'sharedTest' + 'NfsScenarios.kt')
          checks = [
              ('emulator', tests(base % 'androidTest' + 'NfsProviderTest.kt') + scenarios,
               assigned(base % 'androidTest' + 'NfsProviderTest.kt')),
              ('host', scenarios, assigned(base % 'test' + 'NfsHostLoadTest.kt')),
          ]
          failed = False
          for name, all_tests, groups_ in checks:
              problems = sorted(set(all_tests) ^ set(groups_)) + sorted({t for t in groups_ if groups_.count(t) > 1})
              if problems:
                  print('::error title=Shards::%s tests not in exactly one shard: %s' % (name, ', '.join(problems)))
                  failed = True
          if failed:
              raise SystemExit(1)
          PY
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      # Caches dependencies and the Gradle build cache between runs.
      - uses: gradle/actions/setup-gradle@v4
      # Previous build outputs: Gradle and Kotlin only redo what the commit changed.
      - uses: actions/cache@v4
        with:
          path: |
            app/build
            build
            .gradle
          key: nfs-test-build-${{ github.sha }}
          restore-keys: nfs-test-build-
      - name: Build
        run: |
          set -o pipefail
          # Only the emulator's ABI; lint runs in the release build.
          ./gradlew assembleDebug assembleDebugAndroidTest -PciAbi=x86_64 2>&1 | tee gradle.log
      - name: Report errors
        if: failure()
        run: |
          # One annotation with the errors, readable from the check-run API.
          body="$({ grep -E '^e: |error:|Error:' gradle.log; grep -E -A5 'What went wrong' gradle.log; } | head -80 \
            | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')"
          echo "::error title=gradle::${body}"
      # For the emulator tests only; not meant to be installed.
      - uses: actions/upload-artifact@v4
        with:
          name: ci-test-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          retention-days: 14

  release:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: |
            app/build
            build
            .gradle
          key: nfs-release-build-${{ github.sha }}
          restore-keys: nfs-release-build-
      - name: Build release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.NFS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NFS_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nfs-release.jks"
            export STORE_FILE="$RUNNER_TEMP/nfs-release.jks" STORE_PASSWORD="$KEYSTORE_PASSWORD"
            export KEY_ALIAS=nfs KEY_PASSWORD="$KEYSTORE_PASSWORD"
            signature="private key from the NFS_KEYSTORE_* secrets"
          else
            # No secrets yet: sign with the provisional key committed to the repository, so a
            # release APK always exists. Its private key is public; switching to the secrets later
            # changes the signature, which requires reinstalling the app once.
            export STORE_FILE="$GITHUB_WORKSPACE/app/nfs-provisional.jks" STORE_PASSWORD=provisional
            export KEY_ALIAS=nfs KEY_PASSWORD=provisional
            signature="PROVISIONAL public key (add the NFS_KEYSTORE_* secrets to replace it)"
          fi
          # arm64-v8a: every current phone.
          ./gradlew assembleNfsRelease -PciAbi=arm64-v8a 2>&1 | tee gradle.log
          version="$(sed -n "s/^ *versionName '\(.*\)'$/\1/p" app/build.gradle)"
          mkdir -p dist
          cp app/build/outputs/apk/nfsRelease/app-nfsRelease.apk "dist/MaterialFiles-NFS-$version.apk"
          rm -f "$RUNNER_TEMP/nfs-release.jks"
          echo "::notice title=Release APK::MaterialFiles-NFS-$version.apk, signed with the $signature"
      # The one to install: release build, application ID me.zhanghai.android.files.nfs.
      - uses: actions/upload-artifact@v4
        with:
          name: MaterialFiles-NFS
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 90
      - name: Report errors
        if: failure()
        run: |
          body="$({ grep -E '^e: |error:|Error:' gradle.log; grep -E -A5 'What went wrong' gradle.log; } | head -80 \
            | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')"
          echo "::error title=gradle::${body}"

  host:
    name: Host ${{ matrix.link }} / ${{ matrix.shard }}
    runs-on: ubuntu-latest
    # The CI must finish within 20 minutes; a hung test fails after 6 (NfsScenarios.watchdog).
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The load scenarios (NfsScenarios), run by the app's NFS code on this machine
        # (NfsHostLoadTest, Robolectric) against nfsd over a link emulated on loopback, as the
        # user runs them: the VPN without TLS, the LAN with mutual TLS (tlshd, real handshakes
        # and encryption, without the emulator's CPU limit).
        link: [VPN-like, LAN-like]
        shard: [movies, scenes, load, jumps, changes]
        include:
          - link: VPN-like
            security: none
            export: /
            data: /srv/nfs
            netem: delay 50ms loss 0.3% rate 100mbit limit 10000
            mtu: 1420
            upload_mib: 64
          - link: LAN-like
            security: mtls
            export: /mtls
            data: /srv/mtls-data
            netem: delay 3ms
            upload_mib: 256
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: 43fdfdg45454/libnfs-android
          ref: ${{ env.LIBNFS_REF }}
          path: libnfs-android
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: |
            app/build
            build
            .gradle
          key: nfs-unit-build-${{ github.sha }}
          restore-keys: nfs-unit-build-
      - name: Build libnfs and the tests; set up the server
        run: |
          set -o pipefail
          # libnfs for this machine (optimized, like the phone's), while Gradle compiles.
          ( cmake -S libnfs-android/library -B libnfs-host -DCMAKE_BUILD_TYPE=Release \
              && cmake --build libnfs-host -j2 ) > libnfs-build.log 2>&1 &
          libnfs=$!
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends nfs-kernel-server ktls-utils \
            || { sudo apt-get update -q; sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends nfs-kernel-server ktls-utils; }
          # Mutual TLS (as the emulator's job): a throwaway CA, the server's certificate for
          # 127.0.0.1 and a client certificate (PKCS#12, password "test") for the test.
          mkdir -p certs && cd certs
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 2 \
            -keyout ca.key -out ca.pem -subj /CN=mf-test-ca \
            -addext basicConstraints=critical,CA:TRUE -addext keyUsage=critical,keyCertSign
          for cert in server client; do
            openssl req -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -keyout $cert.key \
              -out $cert.csr -subj /CN=$cert
          done
          printf 'subjectAltName=IP:127.0.0.1\nextendedKeyUsage=serverAuth\n' > server.ext
          printf 'extendedKeyUsage=clientAuth\n' > client.ext
          for cert in server client; do
            openssl x509 -req -in $cert.csr -CA ca.pem -CAkey ca.key -CAcreateserial -days 2 \
              -extfile $cert.ext -out $cert.pem
          done
          openssl pkcs12 -export -in client.pem -inkey client.key -out client.p12 -passout pass:test
          # tlshd 0.9 (Ubuntu 24.04) verifies client certificates against the system store.
          sudo install -m 644 ca.pem /usr/local/share/ca-certificates/mf-test-ca.crt
          sudo update-ca-certificates > /dev/null
          sudo install -d /etc/tlshd
          sudo install -m 644 ca.pem server.pem /etc/tlshd/
          sudo install -m 600 server.key /etc/tlshd/
          cd ..
          printf '%s\n' '[authenticate.server]' 'x509.truststore=/etc/tlshd/ca.pem' \
            'x509.certificate=/etc/tlshd/server.pem' 'x509.private_key=/etc/tlshd/server.key' \
            | sudo tee /etc/tlshd.conf
          sudo modprobe tls
          sudo systemctl restart tlshd
          # nfsd applies a nested export's xprtsec policy only at a mount point: a bind mount.
          sudo mkdir -p /srv/nfs/mtls /srv/mtls-data
          sudo mount --bind /srv/mtls-data /srv/nfs/mtls
          sudo chmod 1777 /srv/nfs /srv/nfs/mtls
          sudo mkdir -p ${{ matrix.data }}/.mf-fixtures
          # Videos of real sizes, every 8-byte word its offset plus the file's tag (bits 48 up).
          sudo python3 - ${{ matrix.data }}/.mf-fixtures "${{ matrix.shard }}" <<'PY'
          import array, os, sys
          directory = sys.argv[1]
          chunk = 8 << 20
          videos = [('movie-1', 1, 250), ('movie-2', 2, 500), ('movie-3', 3, 700),
                    ('episode-1', 11, 250), ('episode-2', 12, 250), ('episode-3', 13, 250)]
          changing = [('delete-app', 31, 200), ('delete-other', 32, 200),
                      ('modify-other', 33, 200), ('append-other', 34, 200),
                      ('truncate-other', 35, 200)]
          for name, tag, mib in (changing if sys.argv[2] == 'changes' else videos):
              with open(os.path.join(directory, name + '.bin'), 'wb') as f:
                  for start in range(0, mib << 20, chunk):
                      base = (tag << 48) + start
                      f.write(array.array('Q', range(base, base + chunk, 8)).tobytes())
          PY
          sudo chmod -R a+rX ${{ matrix.data }}/.mf-fixtures
          options=rw,insecure,no_root_squash,no_subtree_check
          printf '%s\n' \
            "/srv/nfs 127.0.0.1($options,fsid=0,crossmnt,xprtsec=none:tls:mtls)" \
            "/srv/nfs/mtls 127.0.0.1($options,fsid=3,xprtsec=mtls)" | sudo tee /etc/exports
          sudo systemctl restart nfs-kernel-server
          sudo exportfs -rav
          # The configuration recommended to users.
          echo 64 | sudo tee /proc/fs/nfsd/threads
          # Compiled, and Robolectric's Android jars downloaded, before the link gets slow (the
          # tests skip themselves without nfsHost).
          ./gradlew testDebugUnitTest --tests '*NfsHostLoadTest*' 2>&1 | tee gradle.log
          wait $libnfs || { cat libnfs-build.log; exit 1; }
          ls libnfs-host/*.so
      - name: ${{ matrix.link }} link
        run: |
          # As the emulator's profiles (loopback is crossed once each way): the VPN about 100 ms
          # round trips, 0.3 % loss, 100 Mb/s and WireGuard's MTU; the LAN about 6 ms.
          if [ -n "${{ matrix.mtu }}" ]; then
            sudo ip link set lo mtu ${{ matrix.mtu }}
          fi
          sudo tc qdisc add dev lo root netem ${{ matrix.netem }}
      - name: Run the scenarios
        run: |
          set -o pipefail
          ./gradlew --offline testDebugUnitTest --tests '*NfsHostLoadTest*' \
            -Dnfs.libraryPath="$PWD/libnfs-host" -Dnfs.nfsHost=127.0.0.1 \
            -Dnfs.nfsExport=${{ matrix.export }} -Dnfs.nfsSecurity=${{ matrix.security }} \
            -Dnfs.nfsTlsCa="$PWD/certs/ca.pem" -Dnfs.nfsTlsClient="$PWD/certs/client.p12" \
            -Dnfs.nfsShard=${{ matrix.shard }} -Dnfs.nfsReport="$PWD/host-report.txt" \
            -Dnfs.uploadMiB=${{ matrix.upload_mib }} 2>&1 | tee -a gradle.log
      - name: Report results
        if: always()
        run: |
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          enc = lambda t: t.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
          passed, failed, skipped = [], [], 0
          for path in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              for case in ET.parse(path).getroot().iter('testcase'):
                  failure = case.find('failure')
                  if failure is None:
                      failure = case.find('error')
                  if case.find('skipped') is not None:
                      skipped += 1
                  elif failure is not None:
                      message = (failure.get('message') or failure.text or '')[:6000]
                      failed.append('%s: %s' % (case.get('name'), message))
                  else:
                      passed.append(case.get('name'))
          report = open('host-report.txt').read() if os.path.exists('host-report.txt') else ''
          body = '%d passed, %d failed, %d skipped%%0A' % (len(passed), len(failed), skipped)
          body += enc(report) + ''.join('%0A' + enc(f) for f in failed)
          if not passed and not failed and os.path.exists('gradle.log'):
              log = open('gradle.log', errors='replace').read().splitlines()
              body += '%0A' + enc('\n'.join([l for l in log if l.startswith('e: ') or 'rror' in l][:40]))
          kind = 'notice' if passed and not failed else 'error'
          print('::%s title=NFS host ${{ matrix.link }} shard ${{ matrix.shard }}::%s' % (kind, body))
          PY
          # Connections dropped: resets seen by the server's TCP, packets netem dropped.
          body="$( { nstat -az 2>/dev/null | grep -E 'TcpEstabResets|TcpOutRsts|TcpExtTCPTimeouts|TcpRetransSegs' ; tc -s qdisc show dev lo ; sudo dmesg | grep -iE 'nfsd|rpc-srv' | tail -n 10 ; } | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          echo "::notice title=Server network host ${{ matrix.link }} ${{ matrix.shard }}::${body}"

  emulator-test:
    name: Emulator ${{ matrix.link }} / ${{ matrix.security }} / ${{ matrix.shard }}
    needs: build
    runs-on: ubuntu-latest
    # The CI must finish within 20 minutes; a hung test fails after 6 (NfsProviderTest.watchdog).
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # What the user runs: mTLS on the LAN, no TLS over the VPN (the tunnel encrypts).
        link: [Wi-Fi-like, VPN-like]
        security: [none, mtls]
        # Each scenario's tests split over parallel emulators, in groups of about the same
        # duration (measured per test; the groups are NfsProviderTest.SHARDS).
        shard: [idle, stream, transfer, movies, scenes, load, jumps, changes]
        # Over the VPN-like link the emulator runs only what is not load: its user-mode network
        # drops connections under load, which a real VPN does not. The load scenarios run over a
        # faithful VPN-like link on the host instead (job host-vpn).
        exclude:
          - link: Wi-Fi-like
            security: none
          - link: VPN-like
            security: mtls
          - link: VPN-like
            shard: movies
          - link: VPN-like
            shard: scenes
          - link: VPN-like
            shard: load
          - link: VPN-like
            shard: jumps
          - link: VPN-like
            shard: changes
        include:
          - link: Wi-Fi-like
            netem: delay 3ms
            throughput_mib: 32
            stream_mib: 64
            data_mib: 12
            upload_mib: 256
          - link: VPN-like
            # A WireGuard VPN over the internet to a home server with 100 Mb/s of upload: about
            # 100 ms round trip (loopback is crossed once each way) and a little loss. No jitter:
            # netem jitter reorders packets, which TCP takes for losses on every connection at
            # once, while packets on a real path keep their order.
            netem: delay 50ms loss 0.3% rate 100mbit limit 10000
            # WireGuard's MTU. Loopback's default of 64 KiB turns each lost packet into a lost
            # 64 KiB burst, which stalls uploads far beyond anything a real VPN does.
            mtu: 1420
            throughput_mib: 8
            stream_mib: 64
            data_mib: 3
            upload_mib: 64
          - security: none
            export: /
          - security: mtls
            export: /mtls
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ci-test-apks
          path: apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start NFS server (plain, TLS and mTLS exports)
        run: |
          set -ex
          sudo apt-get install -y -q --no-install-recommends nfs-kernel-server ktls-utils \
            || { sudo apt-get update -q; sudo apt-get install -y -q --no-install-recommends \
                 nfs-kernel-server ktls-utils; }
          # Throwaway CA, server certificate (the emulator reaches the host as 10.0.2.2) and
          # client certificate for mutual TLS.
          mkdir -p certs && cd certs
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 2 \
            -keyout ca.key -out ca.pem -subj /CN=mf-test-ca \
            -addext basicConstraints=critical,CA:TRUE -addext keyUsage=critical,keyCertSign
          for cert in server client; do
            openssl req -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -keyout $cert.key \
              -out $cert.csr -subj /CN=$cert
          done
          printf 'subjectAltName=IP:10.0.2.2,IP:127.0.0.1\nextendedKeyUsage=serverAuth\n' > server.ext
          printf 'extendedKeyUsage=clientAuth\n' > client.ext
          for cert in server client; do
            openssl x509 -req -in $cert.csr -CA ca.pem -CAkey ca.key -CAcreateserial -days 2 \
              -extfile $cert.ext -out $cert.pem
          done
          openssl pkcs12 -export -in client.pem -inkey client.key -out client.p12 -passout pass:test
          base64 -w0 ca.pem > ca.b64
          base64 -w0 client.p12 > client.b64
          # tlshd 0.9 (Ubuntu 24.04) verifies client certificates against the system store.
          sudo install -m 644 ca.pem /usr/local/share/ca-certificates/mf-test-ca.crt
          sudo update-ca-certificates > /dev/null
          sudo install -d /etc/tlshd
          sudo install -m 644 ca.pem server.pem /etc/tlshd/
          sudo install -m 600 server.key /etc/tlshd/
          cd ..
          printf '%s\n' '[authenticate.server]' 'x509.truststore=/etc/tlshd/ca.pem' \
            'x509.certificate=/etc/tlshd/server.pem' 'x509.private_key=/etc/tlshd/server.key' \
            | sudo tee /etc/tlshd.conf
          sudo modprobe tls
          sudo systemctl restart tlshd
          sudo systemctl stop nfs-kernel-server
          sudo modprobe nfsd
          mountpoint -q /proc/fs/nfsd || sudo mount -t nfsd nfsd /proc/fs/nfsd
          # A short NFSv4 lease lets the idle-session test prove renewal quickly. It must stay
          # above libnfs's fixed 30 s session renewal interval (Linux defaults to 90 s).
          echo 35 | sudo tee /proc/fs/nfsd/nfsv4leasetime
          echo 35 | sudo tee /proc/fs/nfsd/nfsv4gracetime
          # nfsd applies a nested export's xprtsec policy only at a mount point: bind mounts.
          sudo mkdir -p /srv/nfs/tls /srv/nfs/mtls /srv/tls-data /srv/mtls-data
          sudo mount --bind /srv/tls-data /srv/nfs/tls
          sudo mount --bind /srv/mtls-data /srv/nfs/mtls
          sudo chmod 1777 /srv/nfs /srv/nfs/tls /srv/nfs/mtls
          # A large file already on the server for the streaming test, so that it does not first
          # have to be uploaded over the slow link; its CRC-32 next to it.
          python3 -c "import os,zlib,sys; d=os.urandom(int(sys.argv[1])*1048576); open('/tmp/stream.bin','wb').write(d); open('/tmp/stream.bin.crc32','w').write(str(zlib.crc32(d)))" ${{ matrix.stream_mib }}
          # A 32 MiB file whose every 8-byte word is its own offset, for the scrubbing test to
          # check any range it reads.
          python3 -c "import array; open('/tmp/scrub.bin','wb').write(array.array('Q', range(0, 32 << 20, 8)).tobytes())"
          # And a directory of 200 one-byte files plus a subdirectory, for the listing test.
          mkdir -p /tmp/listing/dir
          python3 -c "[open('/tmp/listing/f%d' % i, 'wb').write(bytes([i % 256])) for i in range(200)]"
          for dir in /srv/nfs /srv/tls-data /srv/mtls-data; do
            sudo mkdir -p $dir/.mf-fixtures
            sudo cp /tmp/stream.bin /tmp/stream.bin.crc32 /tmp/scrub.bin $dir/.mf-fixtures/
            sudo cp -r /tmp/listing $dir/.mf-fixtures/
            sudo chmod -R a+rX $dir/.mf-fixtures
          done
          # Videos of real sizes for the load tests (movies 250, 500 and 700 MiB, three episodes of
          # 250 MiB), only on the export this job uses: every 8-byte word holds its offset plus
          # the file's tag in bits 48 and up, so that every read is checked.
          # The "changes" shard gets 200 MiB files it deletes and changes instead.
          case "${{ matrix.shard }}" in movies|scenes|load|jumps|changes)
            case "${{ matrix.security }}" in mtls) dir=/srv/mtls-data;; tls) dir=/srv/tls-data;; *) dir=/srv/nfs;; esac
            sudo python3 - "$dir/.mf-fixtures" "${{ matrix.shard }}" <<'PY'
          import array, os, sys
          directory = sys.argv[1]
          chunk = 8 << 20
          videos = [('movie-1', 1, 250), ('movie-2', 2, 500), ('movie-3', 3, 700),
                    ('episode-1', 11, 250), ('episode-2', 12, 250), ('episode-3', 13, 250)]
          changing = [('delete-app', 31, 200), ('delete-other', 32, 200),
                      ('modify-other', 33, 200), ('append-other', 34, 200),
                      ('truncate-other', 35, 200)]
          for name, tag, mib in (changing if sys.argv[2] == 'changes' else videos):
              with open(os.path.join(directory, name + '.bin'), 'wb') as f:
                  for start in range(0, mib << 20, chunk):
                      base = (tag << 48) + start
                      f.write(array.array('Q', range(base, base + chunk, 8)).tobytes())
          PY
            sudo chmod -R a+rX "$dir/.mf-fixtures"
          esac
          options=rw,insecure,no_root_squash,no_subtree_check
          printf '%s\n' \
            "/srv/nfs 127.0.0.1($options,fsid=0,crossmnt,xprtsec=none:tls:mtls)" \
            "/srv/nfs/tls 127.0.0.1($options,fsid=2,xprtsec=tls:mtls)" \
            "/srv/nfs/mtls 127.0.0.1($options,fsid=3,xprtsec=mtls)" | sudo tee /etc/exports
          sudo systemctl start nfs-kernel-server
          sudo exportfs -rav
          # The configuration recommended to users: with the default 8 threads, 32 streaming
          # connections queue on the server (host tests: 6 MB/s with 8, 10 MB/s with 64).
          echo 64 | sudo tee /proc/fs/nfsd/threads
          # Network profile on loopback, which carries the emulator's traffic to the host.
          if [ -n "${{ matrix.mtu }}" ]; then
            sudo ip link set lo mtu ${{ matrix.mtu }}
          fi
          sudo tc qdisc add dev lo root netem ${{ matrix.netem }}
      - name: Cache AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-x86_64-google_apis-8g
      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          # Room for the read cache of the load tests (videos of hundreds of MB).
          disk-size: 8G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          disk-size: 8G
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: >-
            adb install -r apks/debug/app-debug.apk
            && adb install -r apks/androidTest/debug/app-debug-androidTest.apk
            && adb shell am instrument -w -r
            -e class me.zhanghai.android.files.provider.nfs.NfsProviderTest
            -e shard ${{ matrix.shard }}
            -e nfsExport ${{ matrix.export }}
            -e nfsSecurity ${{ matrix.security }}
            -e tlsCa $(cat certs/ca.b64)
            -e tlsClient $(cat certs/client.b64)
            -e idleMillis 40000
            -e throughputMiB ${{ matrix.throughput_mib }}
            -e streamMiB ${{ matrix.stream_mib }}
            -e dataMiB ${{ matrix.data_mib }}
            -e uploadMiB ${{ matrix.upload_mib }}
            -e link ${{ matrix.link }}
            me.zhanghai.android.files.test/androidx.test.runner.AndroidJUnitRunner
            2>&1 | tee instrument.log
      - name: Server-side network diagnostics
        if: always()
        run: |
          # Connections dropped on the VPN-like link: resets and aborts seen by the server's TCP,
          # and packets the emulated link (netem) dropped, to tell the emulation from a fault.
          body="$( { nstat -az 2>/dev/null | grep -E 'TcpEstabResets|TcpOutRsts|TcpAttemptFails|TcpExtTCPAbortOn|TcpExtTCPTimeouts|TcpRetransSegs|TcpExtListenDrops' ; tc -s qdisc show dev lo ; sudo dmesg | grep -iE 'nfsd|svc|rpc|tcp' | tail -n 15 ; } | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          echo "::notice title=Server network ${{ matrix.link }} ${{ matrix.security }} ${{ matrix.shard }}::${body}"
      - name: Report results
        if: always()
        run: |
          python3 - <<'PY'
          # Parses "am instrument -r" raw output: key=value status lines per test, closed by
          # INSTRUMENTATION_STATUS_CODE (1 start, 0 ok, -1 error, -2 failure, -3 ignored, -4 assumption
          # failure: another shard's test).
          try:
              lines = open('instrument.log', errors='replace').read().splitlines()
          except FileNotFoundError:
              lines = []
          results, current, key = [], {}, None
          for line in lines:
              if line.startswith('INSTRUMENTATION_STATUS: '):
                  key, _, value = line[len('INSTRUMENTATION_STATUS: '):].partition('=')
                  current[key] = value
              elif line.startswith('INSTRUMENTATION_STATUS_CODE: '):
                  code = line.split(': ', 1)[1].strip()
                  if code != '1':
                      results.append((current.get('test', '?'), code, current.get('stack', '')))
                  current, key = {}, None
              elif line.startswith('INSTRUMENTATION_'):
                  key = None
              elif key is not None:
                  current[key] += '\n' + line
          throughput = [l.split('=', 1)[1] for l in lines
                        if l.startswith('INSTRUMENTATION_STATUS: throughput=')]
          timings = [l.split('=', 1)[1] for l in lines
                     if l.startswith('INSTRUMENTATION_STATUS: timing=')]
          passed = [r for r in results if r[1] == '0']
          skipped = [r for r in results if r[1] in ('-3', '-4')]
          failed = [r for r in results if r[1] in ('-1', '-2')]
          ok = bool(results) and not failed and any('OK (' in l for l in lines)
          enc = lambda s: s.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
          body = f"{len(passed)} passed, {len(failed)} failed, {len(skipped)} skipped"
          for t in throughput:
              body += '%0A' + enc('${{ matrix.link }} ${{ matrix.security }} shard ${{ matrix.shard }}: ' + t)
          if timings:
              body += '%0A' + enc('seconds per test: ' + ', '.join(timings))
          for name, _, stack in failed:
              stack_lines = stack.splitlines()
              # The top frames, then every cause: the root cause is what explains a failure.
              kept = stack_lines[:4] + [l for i, l in enumerate(stack_lines)
                                        if i >= 4 and l.startswith('Caused by')]
              body += '%0A' + enc(name + ': ' + '\n'.join(kept))[:3000]
          if not results:
              body += '%0A' + enc('\n'.join(lines[-30:]))
          print(f"::{'notice' if ok else 'error'} title=NFS ${{ matrix.link }} ${{ matrix.security }} shard ${{ matrix.shard }} instrumented tests::{body}")
          if not ok:
              raise SystemExit(1)
          PY
