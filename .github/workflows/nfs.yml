name: NFS

on:
  push:
    branches: [nfs]
  workflow_dispatch:

jobs:
  build:
    name: Build APKs and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      # Caches dependencies and the Gradle build cache between runs.
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          set -o pipefail
          ./gradlew assembleDebug assembleDebugAndroidTest lintVitalRelease 2>&1 | tee gradle.log
      - name: Report errors
        if: failure()
        run: |
          # One annotation with the errors, readable from the check-run API.
          body="$(grep -E '^e: |error:|Error:|What went wrong|FAILURE|> ' gradle.log | head -80 \
            | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')"
          echo "::error title=gradle::${body}"
      # For the emulator tests only; not meant to be installed.
      - uses: actions/upload-artifact@v4
        with:
          name: ci-test-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          retention-days: 14

  release:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.NFS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NFS_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nfs-release.jks"
            export STORE_FILE="$RUNNER_TEMP/nfs-release.jks" STORE_PASSWORD="$KEYSTORE_PASSWORD"
            export KEY_ALIAS=nfs KEY_PASSWORD="$KEYSTORE_PASSWORD"
            signature="private key from the NFS_KEYSTORE_* secrets"
          else
            # No secrets yet: sign with the provisional key committed to the repository, so a
            # release APK always exists. Its private key is public; switching to the secrets later
            # changes the signature, which requires reinstalling the app once.
            export STORE_FILE="$GITHUB_WORKSPACE/app/nfs-provisional.jks" STORE_PASSWORD=provisional
            export KEY_ALIAS=nfs KEY_PASSWORD=provisional
            signature="PROVISIONAL public key (add the NFS_KEYSTORE_* secrets to replace it)"
          fi
          ./gradlew assembleNfsRelease 2>&1 | tee gradle.log
          version="$(sed -n "s/^ *versionName '\(.*\)'$/\1/p" app/build.gradle)"
          mkdir -p dist
          cp app/build/outputs/apk/nfsRelease/app-nfsRelease.apk "dist/MaterialFiles-NFS-$version.apk"
          rm -f "$RUNNER_TEMP/nfs-release.jks"
          echo "::notice title=Release APK::MaterialFiles-NFS-$version.apk, signed with the $signature"
      # The one to install: release build, application ID me.zhanghai.android.files.nfs.
      - uses: actions/upload-artifact@v4
        with:
          name: MaterialFiles-NFS
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 90
      - name: Report errors
        if: failure()
        run: |
          body="$(grep -E '^e: |error:|Error:|What went wrong|FAILURE|> ' gradle.log | head -80 \
            | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')"
          echo "::error title=gradle::${body}"

  emulator-test:
    name: Emulator ${{ matrix.link }} / ${{ matrix.security }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Every link profile with every connection security, all in parallel.
        link: [Wi-Fi-like, VPN-like]
        security: [none, tls, mtls]
        include:
          - link: Wi-Fi-like
            netem: delay 3ms
            throughput_mib: 32
          - link: VPN-like
            netem: delay 20ms 5ms loss 0.3%
            throughput_mib: 4
          - security: none
            export: /
          - security: tls
            export: /tls
          - security: mtls
            export: /mtls
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ci-test-apks
          path: apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start NFS server (plain, TLS and mTLS exports)
        run: |
          set -ex
          sudo apt-get install -y -q --no-install-recommends nfs-kernel-server ktls-utils \
            || { sudo apt-get update -q; sudo apt-get install -y -q --no-install-recommends \
                 nfs-kernel-server ktls-utils; }
          # Throwaway CA, server certificate (the emulator reaches the host as 10.0.2.2) and
          # client certificate for mutual TLS.
          mkdir -p certs && cd certs
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 2 \
            -keyout ca.key -out ca.pem -subj /CN=mf-test-ca \
            -addext basicConstraints=critical,CA:TRUE -addext keyUsage=critical,keyCertSign
          for cert in server client; do
            openssl req -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -keyout $cert.key \
              -out $cert.csr -subj /CN=$cert
          done
          printf 'subjectAltName=IP:10.0.2.2,IP:127.0.0.1\nextendedKeyUsage=serverAuth\n' > server.ext
          printf 'extendedKeyUsage=clientAuth\n' > client.ext
          for cert in server client; do
            openssl x509 -req -in $cert.csr -CA ca.pem -CAkey ca.key -CAcreateserial -days 2 \
              -extfile $cert.ext -out $cert.pem
          done
          openssl pkcs12 -export -in client.pem -inkey client.key -out client.p12 -passout pass:test
          base64 -w0 ca.pem > ca.b64
          base64 -w0 client.p12 > client.b64
          # tlshd 0.9 (Ubuntu 24.04) verifies client certificates against the system store.
          sudo install -m 644 ca.pem /usr/local/share/ca-certificates/mf-test-ca.crt
          sudo update-ca-certificates > /dev/null
          sudo install -d /etc/tlshd
          sudo install -m 644 ca.pem server.pem /etc/tlshd/
          sudo install -m 600 server.key /etc/tlshd/
          cd ..
          printf '%s\n' '[authenticate.server]' 'x509.truststore=/etc/tlshd/ca.pem' \
            'x509.certificate=/etc/tlshd/server.pem' 'x509.private_key=/etc/tlshd/server.key' \
            | sudo tee /etc/tlshd.conf
          sudo modprobe tls
          sudo systemctl restart tlshd
          sudo systemctl stop nfs-kernel-server
          sudo modprobe nfsd
          mountpoint -q /proc/fs/nfsd || sudo mount -t nfsd nfsd /proc/fs/nfsd
          # A short NFSv4 lease lets the idle-session test prove renewal quickly. It must stay
          # above libnfs's fixed 30 s session renewal interval (Linux defaults to 90 s).
          echo 35 | sudo tee /proc/fs/nfsd/nfsv4leasetime
          echo 35 | sudo tee /proc/fs/nfsd/nfsv4gracetime
          # nfsd applies a nested export's xprtsec policy only at a mount point: bind mounts.
          sudo mkdir -p /srv/nfs/tls /srv/nfs/mtls /srv/tls-data /srv/mtls-data
          sudo mount --bind /srv/tls-data /srv/nfs/tls
          sudo mount --bind /srv/mtls-data /srv/nfs/mtls
          sudo chmod 1777 /srv/nfs /srv/nfs/tls /srv/nfs/mtls
          options=rw,insecure,no_root_squash,no_subtree_check
          printf '%s\n' \
            "/srv/nfs 127.0.0.1($options,fsid=0,crossmnt,xprtsec=none:tls:mtls)" \
            "/srv/nfs/tls 127.0.0.1($options,fsid=2,xprtsec=tls:mtls)" \
            "/srv/nfs/mtls 127.0.0.1($options,fsid=3,xprtsec=mtls)" | sudo tee /etc/exports
          sudo systemctl start nfs-kernel-server
          sudo exportfs -rav
          # Network profile on loopback, which carries the emulator's traffic to the host.
          sudo tc qdisc add dev lo root netem ${{ matrix.netem }}
      - name: Cache AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-x86_64-google_apis
      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: >-
            adb install -r apks/debug/app-debug.apk
            && adb install -r apks/androidTest/debug/app-debug-androidTest.apk
            && adb shell am instrument -w -r
            -e class me.zhanghai.android.files.provider.nfs.NfsProviderTest
            -e nfsExport ${{ matrix.export }}
            -e nfsSecurity ${{ matrix.security }}
            -e tlsCa $(cat certs/ca.b64)
            -e tlsClient $(cat certs/client.b64)
            -e idleMillis 40000
            -e throughputMiB ${{ matrix.throughput_mib }}
            me.zhanghai.android.files.test/androidx.test.runner.AndroidJUnitRunner
            | tee instrument.log
      - name: Report results
        if: always()
        run: |
          python3 - <<'PY'
          # Parses "am instrument -r" raw output: key=value status lines per test, closed by
          # INSTRUMENTATION_STATUS_CODE (1 start, 0 ok, -1 error, -2 failure, -3 skipped).
          try:
              lines = open('instrument.log', errors='replace').read().splitlines()
          except FileNotFoundError:
              lines = []
          results, current, key = [], {}, None
          for line in lines:
              if line.startswith('INSTRUMENTATION_STATUS: '):
                  key, _, value = line[len('INSTRUMENTATION_STATUS: '):].partition('=')
                  current[key] = value
              elif line.startswith('INSTRUMENTATION_STATUS_CODE: '):
                  code = line.split(': ', 1)[1].strip()
                  if code != '1':
                      results.append((current.get('test', '?'), code, current.get('stack', '')))
                  current, key = {}, None
              elif line.startswith('INSTRUMENTATION_'):
                  key = None
              elif key is not None:
                  current[key] += '\n' + line
          throughput = [l.split('=', 1)[1] for l in lines
                        if l.startswith('INSTRUMENTATION_STATUS: throughput=')]
          passed = [r for r in results if r[1] == '0']
          skipped = [r for r in results if r[1] == '-3']
          failed = [r for r in results if r[1] in ('-1', '-2')]
          ok = bool(results) and not failed and any('OK (' in l for l in lines)
          enc = lambda s: s.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
          body = f"{len(passed)} passed, {len(failed)} failed, {len(skipped)} skipped"
          for t in throughput:
              body += '%0A' + enc('${{ matrix.link }} ${{ matrix.security }}: ' + t)
          for name, _, stack in failed:
              stack_lines = stack.splitlines()
              # The top frames, then every cause: the root cause is what explains a failure.
              kept = stack_lines[:4] + [l for i, l in enumerate(stack_lines)
                                        if i >= 4 and l.startswith('Caused by')]
              body += '%0A' + enc(name + ': ' + '\n'.join(kept))[:3000]
          if not results:
              body += '%0A' + enc('\n'.join(lines[-30:]))
          print(f"::{'notice' if ok else 'error'} title=NFS ${{ matrix.link }} ${{ matrix.security }} instrumented tests::{body}")
          if not ok:
              raise SystemExit(1)
          PY
