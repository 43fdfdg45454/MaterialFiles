name: NFS

on:
  push:
    branches: [nfs]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Build
        run: ./gradlew --no-daemon assembleDebug 2>&1 | tee gradle.log
      - name: Report errors
        if: failure()
        run: |
          # One annotation with the compiler errors, readable from the check-run API.
          body="$(grep -E '^e: |error:|What went wrong|FAILURE|> ' gradle.log | head -80 \
            | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')"
          echo "::error title=gradle::${body}"
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
